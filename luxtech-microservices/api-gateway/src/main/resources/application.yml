server:
  port: 8080
spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: hebergement-service-public
          uri: lb://hebergement-service
          order: -100
          predicates:
            - Path=/api/hebergement/public/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: hebergement-service
          uri: lb://hebergement-service
          predicates:
            - Path=/api/hebergement/**
          filters:
            - name: JwtAuthFilter
        - id: booking-service-agency
          uri: lb://booking-service
          predicates:
            - Path=/api/booking/agency/**
          filters:
            - name: JwtAuthFilter
        - id: booking-service-hotel
          uri: lb://booking-service
          predicates:
            - Path=/api/booking/hotel/**
          filters:
            - name: JwtAuthFilter
        - id: booking-service-invoices
          uri: lb://booking-service
          predicates:
            - Path=/api/booking/factures/**
          filters:
            - name: JwtAuthFilter
        - id: booking-service-public
          uri: lb://booking-service
          predicates:
            - Path=/api/booking/**
        - id: booking-service-protected
          uri: lb://booking-service
          predicates:
            - Path=/api/reservations/**
          filters:
            - name: JwtAuthFilter
        - id: iso8583-payment-gateway
          uri: lb://iso8583-payment-gateway
          predicates:
            - Path=/api/payments/**
        - id: agency-service
          uri: lb://agency-service
          predicates:
            - Path=/api/agence/**
          filters:
            - name: JwtAuthFilter
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: JwtAuthFilter
        - id: public-api-service
          uri: lb://public-api-service
          predicates:
            - Path=/api/search/**, /api/public/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckx1eHRlY2hNaWNyb3NlcnZpY2VzMjAyNA==}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
