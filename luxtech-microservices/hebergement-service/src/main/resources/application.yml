server:
  port: 8082

spring:
  application:
    name: hebergement-service
  datasource:
    url: jdbc:mysql://localhost:3306/luxtech_hebergement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password:
  # ✅ Augmenter la limite d'upload à 50MB
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings

logging:
  level:
    com.luxtech.hebergement: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

app:
  upload:
    dir: uploads
    base-url: http://localhost:8082/uploads